<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBbeak - Smart Interval Workout Counter</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode">

    <div id="flash-overlay"></div> 

    <main class="fitbbeak-container" id="main-container">
        <header class="header-area">
            <h1 id="brand-header">FitBbeak</h1>
            <div class="header-controls">
                <button id="theme-toggle" class="btn-icon" title="Toggle Theme">
                    <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <div class="lang-selector custom-select" id="langSelector">
                    <div class="select-selected" id="langSelected">EN</div>
                    <div class="select-items select-hide" id="langOptions">
                        <div data-value="en">EN</div>
                        <div data-value="ko">KO</div>
                        <div data-value="de">DE</div>
                        <div data-value="es">ES</div>
                    </div>
                </div>
            </div>
        </header>
        
        <section class="settings-grid">
            <div class="setting-card">
                <label id="label-ready">Ready Time</label>
                <div class="number-control" data-target="readyTime">
                    <button class="btn-adjust btn-minus" data-target="readyTime" data-dir="-1">−</button>
                    <div class="wheel-picker">
                        <div class="wheel-viewport"><div class="wheel-scroller"></div></div>
                        <input type="number" id="readyTime" class="wheel-input hidden" value="5" min="1" max="60">
                    </div>
                    <button class="btn-adjust btn-plus" data-target="readyTime" data-dir="1">+</button>
                </div>
                <span class="unit" id="unit-ready">sec</span>
            </div>
            <div class="setting-card">
                <label id="label-interval">Interval</label>
                <div class="number-control" data-target="interval">
                    <button class="btn-adjust btn-minus" data-target="interval" data-dir="-1">−</button>
                    <div class="wheel-picker">
                        <div class="wheel-viewport"><div class="wheel-scroller"></div></div>
                        <input type="number" id="interval" class="wheel-input hidden" value="1.5" min="0.1" max="5.0" step="0.1">
                    </div>
                    <button class="btn-adjust btn-plus" data-target="interval" data-dir="1">+</button>
                </div>
                <span class="unit" id="unit-interval">sec</span>
            </div>
            <div class="setting-card">
                <label id="label-beeps">Beeps/Rep</label>
                <div class="number-control" data-target="beepsPerRep">
                    <button class="btn-adjust btn-minus" data-target="beepsPerRep" data-dir="-1">−</button>
                    <div class="wheel-picker">
                        <div class="wheel-viewport"><div class="wheel-scroller"></div></div>
                        <input type="number" id="beepsPerRep" class="wheel-input hidden" value="2" min="1">
                    </div>
                    <button class="btn-adjust btn-plus" data-target="beepsPerRep" data-dir="1">+</button>
                </div>
                <span class="unit" id="unit-beeps">count</span>
            </div>
            <div class="setting-card">
                <label id="label-goal">Goal Reps</label>
                <div class="number-control" data-target="maxReps">
                    <button class="btn-adjust btn-minus" data-target="maxReps" data-dir="-1">−</button>
                    <div class="wheel-picker">
                        <div class="wheel-viewport"><div class="wheel-scroller"></div></div>
                        <input type="number" id="maxReps" class="wheel-input hidden" value="20" min="1">
                    </div>
                    <button class="btn-adjust btn-plus" data-target="maxReps" data-dir="1">+</button>
                </div>
                <span class="unit" id="unit-goal">reps</span>
            </div>
        </section>

        <section id="display-area">
            <div class="progress-container">
                <svg class="progress-ring" viewBox="0 0 280 280">
                    <circle class="progress-ring__circle-bg" stroke="currentColor" stroke-width="12" fill="transparent" r="120" cx="140" cy="140"/>
                    <circle class="progress-ring__circle" stroke="url(#gradient)" stroke-width="12" stroke-linecap="round" fill="transparent" r="120" cx="140" cy="140"/>
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3498db" />
                            <stop offset="100%" stop-color="#9b59b6" />
                        </linearGradient>
                    </defs>
                </svg>
                <div class="counter-content">
                    <div id="counter">0</div>
                    <div id="status-text">Ready?</div>
                </div>
            </div>
        </section>

        <footer class="controls-area">
            <button id="startBtn" class="btn-cta">START WORKOUT</button>
            <div id="activeBtns" class="btn-group hidden">
                <button id="pauseBtn" class="btn-secondary">PAUSE</button>
                <button id="stopBtn" class="btn-danger">STOP</button>
            </div>
        </footer>
    </main>

    <!-- WebView Simulation Area -->
    <div class="webview-container">
        <iframe src="explanation.html" id="explanation-frame" frameborder="0" scrolling="no" title="FitBbeak Guide"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
