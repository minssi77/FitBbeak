name: Build and Sign FitBbeak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: |
          npm run build
          # 빌드 후 www 폴더가 생성되었는지 터미널에서 확인하는 로직 추가
          ls -R ./www/index.html || echo "Error: index.html not found in www"

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Android Release
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Sign App
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          # 빌드 도구 버전을 명시적으로 지정하여 경로 오류를 해결합니다.
          buildToolsVersion: 34.0.0

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FitBbeak-Signed-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
