name: Build and Sign FitBbeak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 캐시 설정을 추가하여 빌드 속도를 높입니다.
          cache: 'npm'

      - name: Install Dependencies and Build Web
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Build Android Release
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Sign App
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        # with: 내부가 아닌 env: 블록에 작성해야 합니다.
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FitBbeak-Signed-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          # APK 경로 대신 bundle(번들) 경로를 지정하여 AAB 파일을 찾습니다.
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: FitBbeak-Signed-AAB
          path: ${{ steps.sign_aab.outputs.signedReleaseFile }}

