name: Build FitBbeak APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 코드 가져오기 (Checkout)
      uses: actions/checkout@v4

    - name: 2. 노드(Node.js) 설치 및 빌드 준비
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: |
        npm install
        mkdir -p www
        cp *.html *.js *.css 2>/dev/null || :
        npx cap sync android

    - name: 3. 자바(Java) 21 환경 세팅
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: 4. 앱 추출 (Assemble Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 5. 에이피케이(APK) 파일 저장
      uses: actions/upload-artifact@v4
      with:
        name: FitBbeak-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
